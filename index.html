<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retcon Flow</title>

    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0F1720">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Retcon Flow">

    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
    <link rel="apple-touch-icon" href="./icon-512.png">

    <script src="./config.js"></script>

    <style>
      :root {
        --navy: #0F1720;
        --teal: #14A3A3;
        --green: #6BBF59;
        --text: #ffffff;
        --muted: #d1d5db;
        --card: rgba(255, 255, 255, 0.08);
        --border: rgba(255, 255, 255, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        font-family: Arial, sans-serif;
        background:
          radial-gradient(circle at 85% 12%, rgba(20, 163, 163, 0.22), transparent 28%),
          radial-gradient(circle at 12% 90%, rgba(107, 191, 89, 0.20), transparent 28%),
          var(--navy);
        color: var(--text);
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
      }

      .shell {
        width: 100%;
        max-width: 420px;
        text-align: center;
      }

      .card {
        border: 1px solid var(--border);
        border-radius: 26px;
        padding: 28px 20px;
        background: var(--card);
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.32);
        backdrop-filter: blur(10px);
      }

      .logo {
        width: 112px;
        height: 112px;
        border-radius: 26px;
        margin-bottom: 16px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
      }

      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.1;
      }

      .tagline {
        margin: 8px 0 20px;
        color: var(--muted);
        font-size: 14px;
      }

      .status {
        margin: 14px 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.4;
      }

      .button {
        display: block;
        width: 100%;
        border: none;
        border-radius: 999px;
        padding: 14px 18px;
        margin-top: 10px;
        background: linear-gradient(90deg, var(--teal), var(--green));
        color: white;
        font-size: 15px;
        font-weight: bold;
        text-decoration: none;
        cursor: pointer;
      }

      .button.secondary {
        background: rgba(255, 255, 255, 0.13);
        border: 1px solid rgba(255, 255, 255, 0.18);
      }

      .setup {
        display: none;
        margin-top: 18px;
        text-align: left;
      }

      .setup.active {
        display: block;
      }

      label {
        display: block;
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 12px;
        font-weight: bold;
      }

      textarea {
        width: 100%;
        min-height: 96px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 16px;
        padding: 12px;
        background: rgba(255, 255, 255, 0.10);
        color: white;
        font-size: 13px;
        resize: vertical;
      }

      textarea::placeholder {
        color: rgba(255, 255, 255, 0.55);
      }

      .hint {
        margin-top: 8px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }

      .footer {
        margin-top: 14px;
        color: rgba(255, 255, 255, 0.45);
        font-size: 11px;
      }
    </style>
  </head>

  <body>
    <div class="shell">
      <div class="card">
        <img class="logo" src="./icon-512.png" alt="Retcon Flow">

        <h1>Retcon Flow</h1>
        <div class="tagline">Fund first. Spend with clarity.</div>

        <div id="status" class="status">Preparing your budget app...</div>

        <button class="button" type="button" onclick="openRetconFlow()">
          Open Retcon Flow
        </button>

        <button class="button secondary" type="button" onclick="toggleSetup()">
          Set or Change App Link
        </button>

        <div id="setupPanel" class="setup">
          <label for="appUrlInput">Apps Script Web App URL</label>
          <textarea
            id="appUrlInput"
            placeholder="Paste your Retcon Flow /exec web app URL here"
          ></textarea>

          <button class="button" type="button" onclick="saveAppUrl()">
            Save App Link
          </button>

          <button class="button secondary" type="button" onclick="clearAppUrl()">
            Clear Saved Link
          </button>

          <div class="hint">
            Use the published Apps Script URL ending in <strong>/exec</strong>, not the test URL ending in <strong>/dev</strong>.
          </div>
        </div>
      </div>

      <div id="footer" class="footer">
        Retcon Flow Launcher
      </div>
    </div>

    <script>
      const CONFIG = window.RETCON_FLOW_CONFIG || {};
      const STORAGE_KEY = "retconFlowAppUrl";

      function getSavedAppUrl() {
        const savedUrl = localStorage.getItem(STORAGE_KEY);
        const defaultUrl = CONFIG.defaultAppUrl || "";

        return String(savedUrl || defaultUrl || "").trim();
      }

      function setStatus(message) {
        document.getElementById("status").textContent = message;
      }

      function getOpenUrl(baseUrl) {
        const url = String(baseUrl || "").trim();

        if (!url) {
          return "";
        }

        const separator = url.indexOf("?") === -1 ? "?" : "&";
        const version = encodeURIComponent(CONFIG.launcherVersion || "dev");
        const cacheBust = Date.now();

        return url + separator + "rf_launcher=" + version + "&rf_t=" + cacheBust;
      }

      function openRetconFlow() {
        const appUrl = getSavedAppUrl();

        if (!appUrl) {
          setStatus("Paste your Retcon Flow app link first.");
          document.getElementById("setupPanel").classList.add("active");
          document.getElementById("appUrlInput").focus();
          return;
        }

        if (appUrl.indexOf("/exec") === -1) {
          setStatus("That does not look like a published /exec Web App URL.");
          document.getElementById("setupPanel").classList.add("active");
          return;
        }

        setStatus("Opening Retcon Flow...");
        window.location.href = getOpenUrl(appUrl);
      }

      function toggleSetup() {
        const panel = document.getElementById("setupPanel");
        const input = document.getElementById("appUrlInput");

        input.value = getSavedAppUrl();
        panel.classList.toggle("active");

        if (panel.classList.contains("active")) {
          input.focus();
        }
      }

      function saveAppUrl() {
        const input = document.getElementById("appUrlInput");
        const url = String(input.value || "").trim();

        if (!url) {
          setStatus("Paste your Retcon Flow app link first.");
          return;
        }

        if (url.indexOf("/exec") === -1) {
          setStatus("Use the published Web App URL ending in /exec.");
          return;
        }

        localStorage.setItem(STORAGE_KEY, url);
        setStatus("App link saved. Opening Retcon Flow...");
        setTimeout(openRetconFlow, 500);
      }

      function clearAppUrl() {
        localStorage.removeItem(STORAGE_KEY);
        document.getElementById("appUrlInput").value = "";
        setStatus("Saved app link cleared.");
      }

      function registerServiceWorker() {
        if (!("serviceWorker" in navigator)) {
          return;
        }

        navigator.serviceWorker.register("./service-worker.js").catch(function() {
          // The launcher still works without this.
        });
      }

      function autoOpenIfConfigured() {
        const appUrl = getSavedAppUrl();

        if (!appUrl) {
          setStatus("Set your Retcon Flow app link to begin.");
          document.getElementById("setupPanel").classList.add("active");
          return;
        }

        setStatus("Opening Retcon Flow...");
        setTimeout(openRetconFlow, CONFIG.autoOpenDelayMs || 700);
      }

      document.getElementById("footer").textContent =
        "Retcon Flow Launcher · " + (CONFIG.launcherVersion || "dev");

      registerServiceWorker();
      autoOpenIfConfigured();
    </script>
  </body>
</html>
